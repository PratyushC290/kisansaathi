# Official agronomy documents. `rag/ingest.py` downloads these at build time (data/raw/ is not committed),
# extracts text page by page, and indexes it in Chroma. Page numbers in rules.yaml / answers are PDF page
# indices (the page number your PDF viewer shows), not the printed page number.
